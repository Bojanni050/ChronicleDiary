version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres_password@db:5432/chronicle_diary
      - VITE_API_URL=${VITE_API_URL:-}
      - HINDSIGHT_ENDPOINT=${HINDSIGHT_ENDPOINT:-}
      - HINDSIGHT_API_KEY=${HINDSIGHT_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: chronicle_diary
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chronicle_diary"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
